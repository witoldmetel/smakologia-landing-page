name: Lighthouse & SEO Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  seo-and-lighthouse:
    name: Google Robots, Schema.org & Lighthouse Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Google Robots, Sitemap, Canonical & JSON-LD Schema.org
        run: pnpm run check-seo

      - name: Rebuild with localhost origin for Lighthouse canonical verification
        env:
          ASTRO_SITE: http://localhost:4321
        run: pnpm run build

      - name: Run Google Lighthouse CI Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

name: Lighthouse & SEO Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  seo-and-lighthouse:
    name: Google Robots, Schema.org & Lighthouse 100/100 Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle for SEO & Robots inspection
        env:
          ASTRO_SITE: https://smakologia.com
        run: pnpm run build

      - name: Verify Google Robots, Sitemap, Canonical & JSON-LD Schema.org
        run: |
          node -e '
            const fs = require("node:fs");
            const assert = require("node:assert/strict");

            const robots = fs.readFileSync("dist/robots.txt", "utf8");
            assert.match(robots, /User-agent:\s*\*/);
            assert.match(robots, /Allow:\s*\//);
            assert.match(robots, /Sitemap:\s*https:\/\/smakologia\.com\/sitemap-index\.xml/);

            const sitemapIndex = fs.readFileSync("dist/sitemap-index.xml", "utf8");
            assert.match(sitemapIndex, /https:\/\/smakologia\.com\/sitemap-0\.xml/);

            const sitemap0 = fs.readFileSync("dist/sitemap-0.xml", "utf8");
            assert.match(sitemap0, /<loc>https:\/\/smakologia\.com\/<\/loc>/);

            const html = fs.readFileSync("dist/index.html", "utf8");
            assert.match(html, /<link rel="canonical" href="https:\/\/smakologia\.com\/"/);
            assert.match(html, /<meta name="robots" content="index, follow/);
            assert.match(html, /<meta name="geo\.region" content="PL-24"/);

            const jsonLdMatch = html.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/);
            assert.ok(jsonLdMatch, "Missing application/ld+json script tag");
            const parsed = JSON.parse(jsonLdMatch[1]);
            assert.equal(parsed["@context"], "https://schema.org");
            assert.ok(Array.isArray(parsed["@graph"]) && parsed["@graph"].length >= 5, "Invalid @graph in JSON-LD");
            console.log("All SEO, Robots.txt, Sitemap, and Schema.org JSON-LD checks passed.");
          '

      - name: Rebuild with localhost origin for Lighthouse canonical verification
        env:
          ASTRO_SITE: http://localhost:4321
        run: pnpm run build

      - name: Run Google Lighthouse CI Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
